name = "whatsapp-webhook-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# The queue. Create it once with:  npx wrangler d1 create wa-queue
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "wa-queue"
database_id = "5633efce-0884-463e-9e0d-39db88127d95"

# API_TOKEN is an encrypted secret:  npx wrangler secret put API_TOKEN
# WHATSAPP_API_URL and WHATSAPP_API_KEY are no longer used - the Worker holds
# messages until the bridge collects them instead of forwarding them onward.
